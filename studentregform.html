<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration Form</title>
    <style>
        body{
            background:#ddd;
            font-family: Arial;
        }

        .form-box{
            width:700px;
            margin:20px auto;
            background:#f99999;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        table{
            width:100%;
        }

        td{
            padding:10px;
            vertical-align:top;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        select,
        textarea{
            width:100%;
            padding:8px;
        }

        textarea{
            height:100px;
        }

        .small{
            width:80px;
        }

        .mobile-code{
            width:60px;
        }

        .btn{
            text-align:center;
        }

        button{
            padding:8px 20px;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Student Registration Form></h1>
        <form>
            <table>
                <tr>
                    <td>Roll no:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Student Name:</td>
                    <td><input type="text" class="name" placeholder="First Name"</td>
                    <td><input type="text" class="name" placeholder="Second Name"</td>
                </tr>
                <tr>
                    <td>Father's name :</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Date of Birth</td>
                    <td><input type="text" small placeholder="Day"></td>
                    <td><input type="text" small placeholder="Month"></td>
                    <td><input type="text" small placeholder="Year">(DD-MM-YYYY)</td>
                </tr>
                <tr>
                    <td>Mobile no. :</td>
                    <td>
                        <input type="text" value="+91" readonly style="width:30px; margin-right:5px;">
                        <input type="tel"  maxlength="10" style="width:80%;" >
                    </td>
                </tr>
                <tr>
                    <td>Email id :</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>Password :</td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
                </tr>
                <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
                </tr>
                <tr>
                    <td>Course:</td>
                    <td>
                       <select>
                               <option>---- Select Current Course ----</option>
                               <option>BCA</option>
                               <option>B.Sc</option>
                               <option>B.Tech</option>
                               <option>MCA</option>
                      </select>
                    </td>
                </tr>
                <tr>
                    <td>Student photo:</td>
                    <td><input type="file"</td>
                </tr>
                <tr>
                    <td>City :</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Address :</td>
                    <td><textarea></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" class="btn">
                        <button type="submit">Register</button></td>
                </tr>

                    


            </table>
        </form>
    </div>
    
</body>
</html>
