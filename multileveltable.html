<!DOCTYPE html>
<html>
<head>
    <title>Multi Level Table</title>
    <style>
        table{
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
        }
        .title{
            background: lightgray;
            font-size: 24px;
        }
        .blue{
            background: cyan;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th colspan="5" class="title">My Multi Level Table</th>
    </tr>

    <tr>
        <th rowspan="2" colspan="2" class="blue">Column 0</th>
        <th rowspan="2">Column 1</th>
        <th colspan="2">Column 2</th>
    </tr>

    <tr>
        <th>Column 2a</th>
        <th>Column 2b</th>
    </tr>

    <tr>
        <th rowspan="2">Row 1</th>
        <th>Row 1a</th>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <tr>
        <th>Row 1b</th>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>

    <tr>
        <th colspan="2">Row 2</th>
        <td>123</td>
        <td>456</td>
        <td>789</td>
    </tr>
    

</table>

</body>
</html>
